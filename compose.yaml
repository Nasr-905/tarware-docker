services:

  newt:
    image: fosrl/newt
    container_name: newt-ta
    restart: unless-stopped
    environment:
      - PANGOLIN_ENDPOINT=${PANGOLIN_ENDPOINT}
      - NEWT_ID=${NEWT_ID}
      - NEWT_SECRET=${NEWT_SECRET}
    networks:
          - tarware_net
  # ── Session manager ───────────────────────────────────────────────────────────
  manager:
    image: tarware-manager:latest
    pull_policy: never
    # build:
    #   context: ./manager
    #   dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      DOCKER_NETWORK: "tarware_net"
      SIM_IMAGE: "tarware-simulation:latest"
      SIM_BUILD_CONTEXT: "/sim-src"
      # TA-RWARE configuration — passed through to spawned sim containers
      TARWARE_MAP_NAME: "tiny"
      TARWARE_AGVS: "3"
      TARWARE_PICKERS: "0"
      TARWARE_OBS_TYPE: "partial"
      TARWARE_RENDER_TILE_SIZE: "30"
      # Auto-fit canvas: tile size is computed so the map fits within these dims.
      # Solves two issues: big maps overflowing Xvfb, and tiny maps rendering at
      # too-low resolution. fit_width/fit_height kwargs in tarware/__init__.py
      # take precedence over TARWARE_RENDER_TILE_SIZE when both are set.
      TARWARE_RENDER_WIDTH: "1600"
      TARWARE_RENDER_HEIGHT: "1200"
      TARWARE_REWARD_TYPE: "individual"
      TARWARE_MAP_CSV_PATH: "/app/tarware/data/maps/tiny.csv"
      TARWARE_ORDER_CSV_PATH: "/app/tarware/data/processed/order_data_sample.csv"
      TARWARE_ABC_CSV_PATH: "/app/tarware/data/processed/abc_data_sample.csv"
      TARWARE_STEPS_PER_SIMULATED_SECOND: "2"
      # Run-to-completion: -1 means "end the episode when the order
      # sequencer drains and the pickerwall is empty" (aaj/update behavior).
      # Use a positive integer for a classic step cap.
      TARWARE_MAX_STEPS: "-1"
      # Disable the post-render JPEG downscale (was 0.6). With fit_width/height
      # bounding the canvas, frames are already a reasonable size.
      FRAME_SCALE: "1.0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/nas/shared/containers/tarware-docker/simulation:/sim-src:ro
    networks:
      - tarware_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Streamlit UI ──────────────────────────────────────────────────────────────
  streamlit:
    image: tarware-streamlit:latest
    pull_policy: never
    # build:
    #   context: ./streamlit
    #   dockerfile: Dockerfile
    environment:
      MANAGER_URL: "http://manager:8001"
      MANAGER_PUBLIC_URL: "https://tarware.nasrudeen.com/manager"
      # Fleet-tuner master switch. Set to "1" only on local-development compose;
      # do NOT enable on any deployment that exposes Streamlit publicly via
      # Pangolin. The tuner page also performs a private-IP check on top of
      # this, but the env var is the load-bearing lock.
      TUNER_ENABLED: "1"
    ports:
      - "8501:8501"
    networks:
      - tarware_net
    depends_on:
      manager:
        condition: service_healthy
    restart: unless-stopped

  # ── Simulation image ──────────────────────────────────────────────────────────
  simulation:
    # build:
    #   context: ./simulation
    #   dockerfile: Dockerfile
    image: tarware-simulation:latest
    pull_policy: never
    profiles:
      - build-only
    networks:
      - tarware_net


networks:
  tarware_net:
    name: tarware_net
    driver: bridge
